[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "flask-book-boilerplate"
version = "0.3.2"
description = "A modern Flask book library application and reusable boilerplate."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "FlaskBookBoilerplate contributors" },
]
keywords = ["flask", "sqlite", "sqlalchemy", "boilerplate", "book-library"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Flask",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
]

dependencies = [
    "Flask[dotenv]>=3.1.3,<3.2",
    "SQLAlchemy>=2.0.52,<2.1",
    "Flask-SQLAlchemy>=3.1.1,<3.2",
    "Flask-Migrate>=4.1.0,<5",
    "Flask-Login>=0.6.3,<0.7",
    "Flask-WTF>=1.3.0,<2",
    "email-validator>=2.3.0,<3",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "pytest-cov>=6,<8",
    "ruff>=0.12,<1",
    "types-WTForms",
]

[project.urls]
Repository = "https://github.com/faudard/FlaskBookBoilerplate"
Issues = "https://github.com/faudard/FlaskBookBoilerplate/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
flask_book_boilerplate = [
    "templates/*.html",
    "templates/**/*.html",
    "static/*.css",
    "static/**/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
branch = true
source = ["flask_book_boilerplate"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
show_error_codes = true
files = ["src", "tests"]

