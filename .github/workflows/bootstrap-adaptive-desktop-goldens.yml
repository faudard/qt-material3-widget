name: bootstrap-adaptive-desktop-goldens

on:
  push:
    branches:
      - cert/p0-1.9-final-closure
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  import-reviewed-candidates:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout closure branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download pinned Adaptive Desktop evidence
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: "11355542969"
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/adaptive-desktop-evidence.zip
          mkdir -p /tmp/adaptive-desktop-evidence
          unzip -q /tmp/adaptive-desktop-evidence.zip \
            -d /tmp/adaptive-desktop-evidence

      - name: Verify, record provenance and stage deterministic goldens
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import shutil
          from pathlib import Path

          root = Path("/tmp/adaptive-desktop-evidence")
          report_path = root / "adaptive-desktop-repeatability.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))

          if report.get("sourceCommit") != "43b44f686d983b848fcced5840474108435d3ea4":
              raise SystemExit("unexpected Adaptive Desktop source commit")
          if report.get("repeatable") is not True:
              raise SystemExit("Adaptive Desktop evidence is not repeatable")

          first = root / "adaptive-desktop-first" / "goldens"
          second = root / "adaptive-desktop-second" / "goldens"
          dst = Path("tests/visual/goldens")
          dst.mkdir(parents=True, exist_ok=True)

          images = report.get("images", [])
          if len(images) != 30:
              raise SystemExit(f"expected 30 Adaptive Desktop images, got {len(images)}")

          for entry in images:
              name = entry["name"]
              a = first / f"{name}.png"
              b = second / f"{name}.png"
              if not a.is_file() or not b.is_file():
                  raise SystemExit(f"missing render for {name}")
              a_bytes = a.read_bytes()
              b_bytes = b.read_bytes()
              if a_bytes != b_bytes:
                  raise SystemExit(f"render passes differ for {name}")
              digest = hashlib.sha256(a_bytes).hexdigest()
              if digest != entry["pngSha256"]:
                  raise SystemExit(f"PNG SHA-256 mismatch for {name}")
              shutil.copyfile(a, dst / a.name)

          report["sourceRunId"] = 37333756951
          report["sourceArtifactId"] = 11355542969
          report["sourceArtifactName"] = "adaptive-desktop-visual-evidence"
          out = Path("docs/components/adaptive-desktop-visual-repeatability-1.9.json")
          out.write_text(json.dumps(report, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Commit pinned Adaptive Desktop evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/goldens/adaptive_desktop_*.png
          git add docs/components/adaptive-desktop-visual-repeatability-1.9.json

          if git diff --cached --quiet; then
            echo "Pinned Adaptive Desktop evidence already matches the CI artifact."
            exit 0
          fi

          git commit -m "test(visual): pin deterministic 1.9 adaptive goldens"
          git push origin "HEAD:${GITHUB_REF_NAME}"
