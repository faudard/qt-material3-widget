name: release-assets-bootstrap

on:
  push:
    branches:
      - "release/1.0.0"

permissions:
  contents: write

jobs:
  generate-release-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CTEST_OUTPUT_ON_FAILURE: 1
      QT_STYLE_OVERRIDE: Fusion
      QTMATERIAL3_UPDATE_VISUAL_GOLDENS: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install documentation and Linux runtime packages
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz libxml2-utils
          bash scripts/ci/install-ubuntu-deps.sh

      - name: Install pinned Qt 6.4.0
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.4.0"
          host: linux
          target: desktop
          arch: gcc_64
          cache: true

      - name: Generate stable API baseline
        run: |
          rm -rf build/doxygen
          mkdir -p build/doxygen
          doxygen Doxyfile
          python tools/api_signature_baseline.py \
            --xml-dir build/doxygen/xml \
            --baseline tools/api-baseline-1.0.json \
            --baseline-major 1 \
            --write

      - name: Configure visual golden generation
        run: >
          cmake -S . -B build-visual -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQTMATERIAL3_BUILD_TESTS=ON
          -DQTMATERIAL3_BUILD_EXAMPLES=OFF
          -DQTMATERIAL3_BUILD_BENCHMARKS=OFF
          -DQTMATERIAL3_BUILD_VISUAL_REGRESSION_TESTS=ON
          -DQTMATERIAL3_USE_MCU=OFF

      - name: Build visual regression target
        run: cmake --build build-visual --target tst_theme_visual_regression --parallel

      - name: Generate reviewed-environment goldens
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            bash -c 'openbox >/tmp/openbox-release-assets.log 2>&1 & ctest --test-dir build-visual --output-on-failure -R tst_theme_visual_regression'
          test -f tools/api-baseline-1.0.json
          test "$(find tests/visual/goldens -maxdepth 1 -name '*.png' | wc -l)" -eq 7
          sha256sum tools/api-baseline-1.0.json tests/visual/goldens/*.png

      - name: Prove zero-diff visual reproducibility
        env:
          QTMATERIAL3_UPDATE_VISUAL_GOLDENS: 0
          QTMATERIAL3_VISUAL_STRICT: 1
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            bash -c 'openbox >/tmp/openbox-release-strict.log 2>&1 & ctest --test-dir build-visual --output-on-failure -R tst_theme_visual_regression'

      - name: Commit release assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/api-baseline-1.0.json tests/visual/goldens/*.png
          git commit -m "build: add 1.0 API and visual baselines"
          git push origin HEAD:release/1.0.0

      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          name: release-1.0.0-assets
          path: |
            tools/api-baseline-1.0.json
            tests/visual/goldens/*.png
          if-no-files-found: error
          retention-days: 7
