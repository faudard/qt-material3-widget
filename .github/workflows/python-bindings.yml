name: Python bindings

on:
  pull_request:
    paths:
      - "bindings/python/**"
      - "include/qtmaterial/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/python-bindings.yml"
  push:
    branches: [main]
    paths:
      - "bindings/python/**"
      - "include/qtmaterial/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/python-bindings.yml"

permissions:
  contents: read

jobs:
  wheel-and-contract:
    name: PySide6 / Shiboken6 wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      # PySide6 wheels provide the matching Qt 6.6.3 headers and CMake package.
      # Avoid installing Ubuntu's unrelated Qt 6 development packages and a
      # second Qt SDK: the root CMakeLists.txt already selects PySide6/Qt.
      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Shiboken parser toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm g++-10
          sudo mkdir -p /opt/rh/gcc-toolset-10/root/usr/bin
          sudo cp /usr/bin/g++-10 /opt/rh/gcc-toolset-10/root/usr/bin/c++
          sudo mkdir -p /opt/rh/gcc-toolset-10/root/usr/lib/gcc/x86_64-linux-gnu/10
          sudo cp /usr/lib/gcc/x86_64-linux-gnu/10/cc1plus /opt/rh/gcc-toolset-10/root/usr/lib/gcc/x86_64-linux-gnu/10/
          echo "LLVM_INSTALL_DIR=$(llvm-config --prefix)" >> "$GITHUB_ENV"

      - name: Build wheel
        run: |
          python --version
          python -m pip install --upgrade pip build
          python -m build bindings/python --wheel --outdir wheelhouse

      - name: Install wheel
        run: python -m pip install wheelhouse/*.whl

      - name: Run C++ ↔ Python and ownership contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s bindings/python/tests -v

      - name: Import smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import QtMaterial3
          from QtMaterial3 import Widgets
          assert QtMaterial3.ThemeBuilder
          assert Widgets.QtMaterialFilledButton
          PY
