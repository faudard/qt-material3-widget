name: Python bindings

on:
  pull_request:
    paths:
      - "bindings/python/**"
      - "include/qtmaterial/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/python-bindings.yml"
  push:
    branches: [main]
    paths:
      - "bindings/python/**"
      - "include/qtmaterial/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/python-bindings.yml"

permissions:
  contents: read

jobs:
  wheel-and-contract:
    name: Wheel + ABI + ownership (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.11"
            host: linux
            arch: gcc_64
          - os: ubuntu-24.04
            python: "3.12"
            host: linux
            arch: gcc_64
          - os: macos-15
            python: "3.11"
            host: mac
            arch: clang_64
          - os: windows-2022
            python: "3.11"
            host: windows
            arch: win64_msvc2019_64

    steps:
      - uses: actions/checkout@v6

      # This is a build-time SDK, not an alternative runtime. The Python
      # preflight additionally rejects any mismatch between Qt SDK and wheels.
      - name: Install matching Qt 6.6.3 SDK
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.6.3"
          host: ${{ matrix.host }}
          target: desktop
          arch: ${{ matrix.arch }}
          cache: true

      - name: Select supported CPython
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: bindings/python/pyproject.toml

      # Keep the proven Ubuntu Shiboken 6.6.3 parser/GCC 10 layout. Qt's
      # native binaries and generator must share the same compiler ABI.
      - name: Install Linux Shiboken parser toolchain
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm g++-10
          sudo mkdir -p /opt/rh/gcc-toolset-10/root/usr/bin
          sudo cp /usr/bin/g++-10 /opt/rh/gcc-toolset-10/root/usr/bin/c++
          sudo mkdir -p /opt/rh/gcc-toolset-10/root/usr/lib/gcc/x86_64-linux-gnu/10
          sudo cp /usr/lib/gcc/x86_64-linux-gnu/10/cc1plus /opt/rh/gcc-toolset-10/root/usr/lib/gcc/x86_64-linux-gnu/10/
          echo "LLVM_INSTALL_DIR=$(llvm-config --prefix)" >> "$GITHUB_ENV"

      - name: Install macOS libclang for Shiboken parser
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install llvm
          echo "LLVM_INSTALL_DIR=$(brew --prefix llvm)" >> "$GITHUB_ENV"

      - name: Install wheel toolchain
        run: python -m pip install --upgrade pip build packaging

      - name: Build wheel
        env:
          CMAKE_PREFIX_PATH: ${{ env.QT_ROOT_DIR }}
        run: python -m build bindings/python --wheel --outdir wheelhouse

      - name: Audit wheel tags, payload and runtime metadata
        run: python bindings/python/tests/check_wheel.py wheelhouse

      - name: Install built wheel (not checkout sources)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          wheels = list(Path("wheelhouse").glob("*.whl"))
          assert len(wheels) == 1, wheels
          subprocess.check_call([sys.executable, "-m", "pip", "install", str(wheels[0])])
          PY

      - name: Check installed dependencies and ABI
        run: |
          python -m pip check
          python bindings/python/pyside_config.py --verify-abi

      - name: Run native Python ownership contracts
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONFAULTHANDLER: "1"
        run: python -m unittest discover -s bindings/python/tests -p "test_*.py" -v

      - name: Verify isolated import from installed wheel
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -I -c "import QtMaterial3; from QtMaterial3 import Widgets; from PySide6.QtCore import qVersion; assert QtMaterial3.ThemeBuilder; assert Widgets.QtMaterialFilledButton; assert qVersion() == '6.6.3'"
