name: Python bindings

on:
  pull_request:
    paths:
      - "bindings/python/**"
      - "include/qtmaterial/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/python-bindings.yml"
  push:
    branches: [main]
    paths:
      - "bindings/python/**"
      - "include/qtmaterial/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/python-bindings.yml"

permissions:
  contents: read

jobs:
  wheel-and-contract:
    name: PySide6 / Shiboken6 wheel
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Build wheel
        run: |
          python -m pip install --upgrade pip build
          python -m build bindings/python --wheel --outdir wheelhouse

      - name: Install wheel
        run: python -m pip install wheelhouse/*.whl

      - name: Run C++ ↔ Python and ownership contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s bindings/python/tests -v

      - name: Import smoke
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python - <<'PY'
          import QtMaterial3
          from QtMaterial3 import Widgets
          assert QtMaterial3.ThemeBuilder
          assert Widgets.QtMaterialFilledButton
          PY
