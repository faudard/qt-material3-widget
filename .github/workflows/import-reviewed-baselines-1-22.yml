name: Import reviewed 1.22 baselines (one shot)
on:
  pull_request:
    types: [opened, reopened]
    branches: [main]
permissions:
  contents: read
jobs:
  import:
    if: github.repository == 'faudard/qt-material3-widget' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'certification/1.22-reviewed-baselines'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: certification/1.22-reviewed-baselines
          fetch-depth: 0
      - name: Check source and download the reviewed captures
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch origin a72dac30794983b5d16068535cc0069bee574d1d
          git diff --exit-code a72dac30794983b5d16068535cc0069bee574d1d HEAD -- . ':(exclude).github/workflows/import-reviewed-baselines-1-22.yml'
          gh run download 44361342912 --repo faudard/qt-material3-widget --dir build/review \
            --name navigation-desktop-visual-evidence \
            --name missing-material3-visual-evidence \
            --name adaptive-desktop-visual-evidence \
            --name expressive-catalogue-visual-evidence
          cd build/review
          sha256sum -c <<'HASHES'
          ea186df1d81196287f787b3ab5671b345ab831459d8c4a3406f22d58108a0d15  navigation-desktop-visual-evidence/navigation-repeatability.json
          e52748551f51fd72dd8c2511dc38c0090a9bbb5ea31a563dcbbca7d5c17a120a  missing-material3-visual-evidence/missing-material3-repeatability.json
          af20bde4252168bcc47c4e1b817a068ea04d68aab94b351c3a872cab6de70c46  adaptive-desktop-visual-evidence/adaptive-desktop-repeatability.json
          d2b6e21176844f9530688c14fda0018f60520688e465551e4b90651c70cbd40a  expressive-catalogue-visual-evidence/expressive-catalogue-repeatability.json
          HASHES
      - name: Import exact reference PNGs and provenance
        run: |
          set -euo pipefail
          python tools/refresh_visual_baselines_1_22.py --artifacts build/review --run-id 44361342912 --source-commit a72dac30794983b5d16068535cc0069bee574d1d --apply --confirm-reviewed
          python - <<'PY'
          import json
          import hashlib
          from pathlib import Path

          root = Path("docs/components")
          families = [
              ("missing-material3", "missing-material3", "material3-catalogue-visual-repeatability-1.7.json", "material3-catalogue-certification-1.7.json", 14456184750),
              ("adaptive-desktop", "adaptive-desktop", "adaptive-desktop-visual-repeatability-1.9.json", "adaptive-desktop-certification-1.9.json", 14455149843),
              ("expressive-catalogue", "expressive-catalogue", "expressive-catalogue-visual-repeatability-1.10-1.11.json", "expressive-certification-1.10-1.11.json", 14455729620),
              ("navigation-desktop", "navigation", "navigation-desktop-visual-repeatability-1.5.json", None, 14455334847),
          ]
          for family, prefix, report_name, ledger_name, artifact_id in families:
              artifact_name = family + "-visual-evidence"
              report = json.loads((Path("build/review") / artifact_name / (prefix + "-repeatability.json")).read_text())
              for image in report["images"]:
                  data = (Path("tests/visual/goldens") / (image["name"] + ".png")).read_bytes()
                  assert hashlib.sha256(data).hexdigest() == image["pngSha256"], image["name"]
              assert report["visualReview"] == "pending"
              report.update(sourceRunId=44361342912, sourceArtifactId=artifact_id, sourceArtifactName=artifact_name)
              (root / report_name).write_text(json.dumps(report, indent=2) + "\n")
              if ledger_name:
                  path = root / ledger_name
                  ledger = json.loads(path.read_text())
                  assert ledger["visual"]["status"] == "pending"
                  ledger["visual"]["evidence"] = f"docs/components/{report_name}; GitHub Actions run 44361342912 / artifact {artifact_id}; visual review pending"
                  path.write_text(json.dumps(ledger, indent=2, ensure_ascii=False) + "\n")
          PY
          git add tests/visual/goldens docs/release/visual-baselines-1.22.json docs/components/*visual-repeatability*.json docs/components/material3-catalogue-certification-1.7.json docs/components/adaptive-desktop-certification-1.9.json docs/components/expressive-certification-1.10-1.11.json
          git diff --cached --stat
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "test(1.22): refresh reviewed visual baseline PNGs from run 44361342912"
          git push origin HEAD:refs/heads/certification/1.22-reviewed-baselines
