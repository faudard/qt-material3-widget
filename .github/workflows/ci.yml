name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-qt5.14.2-v142
            os: windows-2022
            qt-version: "5.14.2"
            qt-arch: win64_msvc2017_64
            expected-qt-version: "5.14.2"
            msvc-toolset: "14.29"
            expected-msvc-prefix: "19.29"
            use-mcu: "OFF"
            build-extra-examples: "OFF"

          - name: ubuntu-qt6
            os: ubuntu-latest
            qt-version: "system"
            qt-arch: ""
            expected-qt-version: ""
            msvc-toolset: ""
            expected-msvc-prefix: ""
            use-mcu: "OFF"
            build-extra-examples: "OFF"

          - name: windows-qt6.7.3-v142
            os: windows-2022
            qt-version: "6.7.3"
            qt-arch: win64_msvc2019_64
            expected-qt-version: "6.7.3"
            msvc-toolset: "14.29"
            expected-msvc-prefix: "19.29"
            use-mcu: "OFF"
            build-extra-examples: "OFF"

          - name: macos-qt6.8.4
            os: macos-latest
            qt-version: "6.8.4"
            qt-arch: clang_64
            expected-qt-version: "6.8.4"
            msvc-toolset: ""
            expected-msvc-prefix: ""
            use-mcu: "OFF"
            build-extra-examples: "OFF"

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CTEST_OUTPUT_ON_FAILURE: 1

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux runtime packages
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-ubuntu-deps.sh

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja --no-progress -y

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installationPath) { throw "Visual Studio installation not found" }

          $vsDevCmd = Join-Path $installationPath "Common7\Tools\VsDevCmd.bat"
          $command = '"' + $vsDevCmd + '" -no_logo -arch=x64 -host_arch=x64 -vcvars_ver=${{ matrix.msvc-toolset }} && set'
          $environment = cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "VsDevCmd failed with exit code $LASTEXITCODE" }

          $persist = @("PATH", "INCLUDE", "LIB", "LIBPATH", "VCINSTALLDIR", "VCToolsInstallDir", "VCToolsVersion", "VSINSTALLDIR", "VisualStudioVersion", "WindowsSdkDir", "WindowsSDKVersion", "UniversalCRTSdkDir", "UCRTVersion")
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $matches[1]
              if ($persist -contains $name) {
                "$name=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
          }

      - name: Install Qt
        if: runner.os != 'Linux'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          host: ${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'mac' || 'linux' }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
          cache: true

      - name: Assert installed Qt/MSVC toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          python scripts/ci/check-qt-toolchain.py
          --expected-qt "${{ matrix.expected-qt-version }}"
          --allowed-msvc-prefix "${{ matrix.expected-msvc-prefix }}"

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          -DQTMATERIAL3_EXPECT_QT_VERSION=${{ matrix.expected-qt-version }}
          -DQTMATERIAL3_BUILD_TESTS=ON
          -DQTMATERIAL3_BUILD_EXAMPLES=ON
          -DQTMATERIAL3_BUILD_CONSUMER_EXAMPLES=${{ matrix.build-extra-examples }}
          -DQTMATERIAL3_BUILD_THEMING_EXAMPLES=${{ matrix.build-extra-examples }}
          -DQTMATERIAL3_BUILD_BENCHMARKS=OFF
          -DQTMATERIAL3_USE_MCU=${{ matrix.use-mcu }}

      - name: Configure Unix
        if: runner.os != 'Windows'
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQTMATERIAL3_BUILD_TESTS=ON
          -DQTMATERIAL3_BUILD_EXAMPLES=ON
          -DQTMATERIAL3_BUILD_CONSUMER_EXAMPLES=${{ matrix.build-extra-examples }}
          -DQTMATERIAL3_BUILD_THEMING_EXAMPLES=${{ matrix.build-extra-examples }}
          -DQTMATERIAL3_BUILD_BENCHMARKS=OFF
          -DQTMATERIAL3_USE_MCU=${{ matrix.use-mcu }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            bash -c 'openbox >/tmp/openbox.log 2>&1 & ctest --test-dir build --build-config Release --output-on-failure'

      - name: Test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Test macOS
        if: runner.os == 'macOS'
        shell: bash
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Validate installed consumer on exact Qt 5.14.2
        if: matrix.name == 'windows-qt5.14.2-v142'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          python scripts/ci/run-consumer-matrix.py
          --scenario install-shared
          --build-root "${{ github.workspace }}/build/consumer-qt5142"
          --generator Ninja

  consumer-contract:
    name: consumer-${{ matrix.scenario }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - source-static
          - add-subdirectory-shared
          - fetchcontent-static
          - install-shared
          - install-static
          - invalid-package-component

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v6

      - name: Install Qt/build dependencies
        run: bash scripts/ci/install-ubuntu-deps.sh

      - name: Validate matrix contract
        run: python3 tools/check_build_consumer_matrix.py

      - name: Build consumer scenario
        run: >
          python3 scripts/ci/run-consumer-matrix.py
          --scenario "${{ matrix.scenario }}"
          --build-root "${{ github.workspace }}/build/consumer-contract"

  architecture-zero-debt:
    name: architecture-zero-debt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Python checker tests
        run: >
          python3 -m unittest discover
          -s tests/tools
          -p "test_architecture_zero_debt.py"
          -v

      - name: Zero-debt architecture gate
        run: python3 tools/check_architecture_zero_debt.py --root .

