name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-qt5.14.2-v142
            os: windows-2022
            qt-version: "5.14.2"
            qt-arch: win64_msvc2017_64
            compat-profile: "qt5-primary"
            msvc-toolset: "14.29"
            use-mcu: "OFF"
            build-extra-examples: "OFF"
            build-tests: "ON"
            build-examples: "ON"
            build-parallel-level: "2"

          - name: ubuntu-qt6
            os: ubuntu-latest
            qt-version: "system"
            qt-arch: ""
            compat-profile: "qt6-linux-system"
            msvc-toolset: ""
            use-mcu: "OFF"
            build-extra-examples: "OFF"
            build-tests: "ON"
            build-examples: "ON"
            build-parallel-level: "2"

          - name: ubuntu-qt6.4.0-floor
            os: ubuntu-24.04
            qt-version: "6.4.0"
            qt-arch: gcc_64
            compat-profile: "qt6-linux-floor"
            msvc-toolset: ""
            use-mcu: "OFF"
            build-extra-examples: "OFF"
            build-tests: "ON"
            build-examples: "OFF"
            build-parallel-level: "2"

          - name: windows-qt6.7.3-v142
            os: windows-2022
            qt-version: "6.7.3"
            qt-arch: win64_msvc2019_64
            compat-profile: "qt6-windows"
            msvc-toolset: "14.29"
            use-mcu: "OFF"
            build-extra-examples: "OFF"
            build-tests: "ON"
            build-examples: "ON"
            build-parallel-level: "2"

          - name: macos-qt6.8.3
            os: macos-15
            qt-version: "6.8.3"
            qt-arch: clang_64
            compat-profile: "qt6-macos"
            msvc-toolset: ""
            use-mcu: "OFF"
            build-extra-examples: "OFF"
            build-tests: "ON"
            build-examples: "OFF"
            build-parallel-level: "3"

          - name: macos-intel-qt6.8.3-smoke
            os: macos-15-intel
            qt-version: "6.8.3"
            qt-arch: clang_64
            msvc-toolset: ""
            use-mcu: "OFF"
            build-extra-examples: "OFF"
            build-tests: "OFF"
            build-examples: "OFF"
            build-parallel-level: "2"

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.build-parallel-level }}
      CTEST_OUTPUT_ON_FAILURE: 1

    steps:
      - uses: actions/checkout@v6

      - name: Install Linux runtime packages
        if: runner.os == 'Linux'
        run: bash scripts/ci/install-ubuntu-deps.sh

      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install ninja || true

      - name: Install Windows build tools
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install ninja --no-progress -y

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installationPath) { throw "Visual Studio installation not found" }

          $vsDevCmd = Join-Path $installationPath "Common7\Tools\VsDevCmd.bat"
          $command = '"' + $vsDevCmd + '" -no_logo -arch=x64 -host_arch=x64 -vcvars_ver=${{ matrix.msvc-toolset }} && set'
          $environment = cmd.exe /d /s /c $command
          if ($LASTEXITCODE -ne 0) { throw "VsDevCmd failed with exit code $LASTEXITCODE" }

          $persist = @("PATH", "INCLUDE", "LIB", "LIBPATH", "VCINSTALLDIR", "VCToolsInstallDir", "VCToolsVersion", "VSINSTALLDIR", "VisualStudioVersion", "WindowsSdkDir", "WindowsSDKVersion", "UniversalCRTSdkDir", "UCRTVersion")
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $matches[1]
              if ($persist -contains $name) {
                "$name=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
          }

      - name: Install Qt
        if: runner.os != 'Linux' || matrix.qt-version != 'system'
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ matrix.qt-version }}
          host: ${{ runner.os == 'Windows' && 'windows' || runner.os == 'macOS' && 'mac' || 'linux' }}
          target: desktop
          arch: ${{ matrix.qt-arch }}
          cache: true

      - name: Assert installed Qt/MSVC toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          python scripts/ci/check-qt-toolchain.py
          --profile "${{ matrix.compat-profile }}"

      - name: Configure Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          "-DQTMATERIAL3_EXPECT_QT_VERSION=${{ matrix.qt-version }}"
          -DQTMATERIAL3_BUILD_TESTS=${{ matrix.build-tests }}
          -DQTMATERIAL3_BUILD_EXAMPLES=${{ matrix.build-examples }}
          -DQTMATERIAL3_BUILD_CONSUMER_EXAMPLES=${{ matrix.build-extra-examples }}
          -DQTMATERIAL3_BUILD_THEMING_EXAMPLES=${{ matrix.build-extra-examples }}
          -DQTMATERIAL3_BUILD_BENCHMARKS=OFF
          -DQTMATERIAL3_INSTALL=ON
          -DQTMATERIAL3_USE_MCU=${{ matrix.use-mcu }}

      - name: Configure Unix
        if: runner.os != 'Windows'
        shell: bash
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQTMATERIAL3_BUILD_TESTS=${{ matrix.build-tests }}
          -DQTMATERIAL3_BUILD_EXAMPLES=${{ matrix.build-examples }}
          -DQTMATERIAL3_BUILD_CONSUMER_EXAMPLES=${{ matrix.build-extra-examples }}
          -DQTMATERIAL3_BUILD_THEMING_EXAMPLES=${{ matrix.build-extra-examples }}
          -DQTMATERIAL3_BUILD_BENCHMARKS=OFF
          -DQTMATERIAL3_INSTALL=ON
          -DQTMATERIAL3_USE_MCU=${{ matrix.use-mcu }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            python3 scripts/ci/run-with-openbox.py -- ctest --test-dir build --build-config Release --output-on-failure

      - name: Compare reviewed Navigation goldens
        if: matrix.name == 'ubuntu-qt6.4.0-floor'
        shell: bash
        env:
          QTMATERIAL3_VISUAL_STRICT: "1"
          QTMATERIAL3_VISUAL_ARTIFACTS_DIR: ${{ github.workspace }}/build/navigation-strict/artifacts
          QT_STYLE_OVERRIDE: Fusion
          QT_QPA_PLATFORM: xcb
          QT_SCALE_FACTOR: "1"
          QT_FONT_DPI: "96"
          LC_ALL: C.UTF-8
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            python3 scripts/ci/run-with-openbox.py -- ctest --test-dir build --build-config Release --output-on-failure -R "^tst_navigation_visual_goldens$"

      - name: Render Navigation evidence twice
        if: matrix.name == 'ubuntu-qt6.4.0-floor'
        shell: bash
        env:
          QTMATERIAL3_UPDATE_VISUAL_GOLDENS: "1"
          QT_STYLE_OVERRIDE: Fusion
          QT_QPA_PLATFORM: xcb
          QT_SCALE_FACTOR: "1"
          QT_FONT_DPI: "96"
          LC_ALL: C.UTF-8
        run: |
          for pass in first second; do
            QTMATERIAL3_VISUAL_GOLDENS_DIR="${GITHUB_WORKSPACE}/build/navigation-${pass}/goldens" \
            QTMATERIAL3_VISUAL_ARTIFACTS_DIR="${GITHUB_WORKSPACE}/build/navigation-${pass}/artifacts" \
            xvfb-run -a --server-args="-screen 0 1920x1080x24" \
              python3 scripts/ci/run-with-openbox.py -- ctest --test-dir build --build-config Release --output-on-failure -R "^tst_navigation_visual_goldens$"
          done
          python3 tools/check_navigation_visual_repeatability.py \
            build/navigation-first build/navigation-second \
            --output build/navigation-repeatability.json

      - name: Upload Navigation visual evidence
        if: always() && matrix.name == 'ubuntu-qt6.4.0-floor'
        uses: actions/upload-artifact@v6
        with:
          name: navigation-desktop-visual-evidence
          path: |
            build/navigation-first/
            build/navigation-second/
            build/navigation-strict/
            build/navigation-repeatability.json
          if-no-files-found: warn

      - name: Render Missing Material 3 evidence twice
        if: matrix.name == 'ubuntu-qt6.4.0-floor'
        shell: bash
        env:
          QTMATERIAL3_UPDATE_VISUAL_GOLDENS: "1"
          QT_STYLE_OVERRIDE: Fusion
          QT_QPA_PLATFORM: xcb
          QT_SCALE_FACTOR: "1"
          QT_FONT_DPI: "96"
          LC_ALL: C.UTF-8
        run: |
          for pass in first second; do
            QTMATERIAL3_VISUAL_GOLDENS_DIR="${GITHUB_WORKSPACE}/build/missing-material3-${pass}/goldens" \
            QTMATERIAL3_VISUAL_ARTIFACTS_DIR="${GITHUB_WORKSPACE}/build/missing-material3-${pass}/artifacts" \
            xvfb-run -a --server-args="-screen 0 1920x1080x24" \
              python3 scripts/ci/run-with-openbox.py -- ctest --test-dir build --build-config Release --output-on-failure -R "^tst_missing_material3_visual_goldens$"
          done
          python3 tools/check_missing_material3_visual_repeatability.py \
            build/missing-material3-first build/missing-material3-second \
            --output build/missing-material3-repeatability.json

      - name: Upload Missing Material 3 visual evidence
        if: always() && matrix.name == 'ubuntu-qt6.4.0-floor'
        uses: actions/upload-artifact@v6
        with:
          name: missing-material3-visual-evidence
          path: |
            build/missing-material3-first/
            build/missing-material3-second/
            build/missing-material3-repeatability.json
          if-no-files-found: warn

      - name: Render Adaptive Desktop evidence twice
        if: matrix.name == 'ubuntu-qt6.4.0-floor'
        shell: bash
        env:
          QTMATERIAL3_UPDATE_VISUAL_GOLDENS: "1"
          QT_STYLE_OVERRIDE: Fusion
          QT_QPA_PLATFORM: xcb
          QT_SCALE_FACTOR: "1"
          QT_FONT_DPI: "96"
          LC_ALL: C.UTF-8
        run: |
          for pass in first second; do
            QTMATERIAL3_VISUAL_GOLDENS_DIR="${GITHUB_WORKSPACE}/build/adaptive-desktop-${pass}/goldens" \
            QTMATERIAL3_VISUAL_ARTIFACTS_DIR="${GITHUB_WORKSPACE}/build/adaptive-desktop-${pass}/artifacts" \
            xvfb-run -a --server-args="-screen 0 1920x1080x24" \
              python3 scripts/ci/run-with-openbox.py -- ctest --test-dir build --build-config Release --output-on-failure -R "^tst_adaptive_desktop_visual_goldens$"
          done
          python3 tools/check_adaptive_desktop_visual_repeatability.py \
            build/adaptive-desktop-first build/adaptive-desktop-second \
            --output build/adaptive-desktop-repeatability.json

      - name: Upload Adaptive Desktop visual evidence
        if: always() && matrix.name == 'ubuntu-qt6.4.0-floor'
        uses: actions/upload-artifact@v6
        with:
          name: adaptive-desktop-visual-evidence
          path: |
            build/adaptive-desktop-first/
            build/adaptive-desktop-second/
            build/adaptive-desktop-repeatability.json
          if-no-files-found: warn

      - name: Generate family visual candidate goldens
        if: matrix.name == 'ubuntu-qt6.4.0-floor'
        shell: bash
        env:
          QTMATERIAL3_UPDATE_VISUAL_GOLDENS: "1"
          QTMATERIAL3_VISUAL_GOLDENS_DIR: ${{ github.workspace }}/build/family-candidate-goldens
          QT_STYLE_OVERRIDE: Fusion
          QT_QPA_PLATFORM: xcb
          QT_SCALE_FACTOR: "1"
          QT_FONT_DPI: "96"
          LC_ALL: C.UTF-8
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            python3 scripts/ci/run-with-openbox.py -- ctest --test-dir build --build-config Release --output-on-failure -R "^tst_theme_visual_regression$"

      - name: Upload family visual candidate goldens
        if: always() && matrix.name == 'ubuntu-qt6.4.0-floor'
        uses: actions/upload-artifact@v6
        with:
          name: family-visual-candidate-goldens
          path: |
            build/family-candidate-goldens/selection_matrix_*.png
            build/family-candidate-goldens/input_field_matrix_*.png
            build/family-candidate-goldens/input_composite_matrix_*.png
            build/family-candidate-goldens/navigation_*.png
            build/family-candidate-goldens/input_slider_matrix_*.png
            build/family-candidate-goldens/desktop_data_matrix_*.png
            build/family-candidate-goldens/data_extended_matrix_*.png
            build/family-candidate-goldens/progress_compact_matrix_*.png
            build/family-candidate-goldens/surface_bar_matrix_*.png
            build/family-candidate-goldens/surface_overlay_matrix_*.png
            build/family-candidate-goldens/missing_material3_matrix_*.png
            build/family-candidate-goldens/layout_matrix_*.png
          if-no-files-found: warn

      - name: Test Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Report Windows QtTest failures
        if: failure() && runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Test-Path build/tests) {
            Get-ChildItem build/tests -Filter "tst_*.txt" | ForEach-Object {
              if (Select-String -Path $_.FullName -Pattern 'FAIL!|QFATAL|Received signal' -Quiet) {
                Get-Content $_.FullName
              }
            }
          }

      - name: Upload Windows QtTest reports
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v6
        with:
          name: qttest-${{ matrix.name }}
          path: |
            build/tests/tst_*.txt
            build/Testing/Temporary/LastTest.log
          if-no-files-found: warn

      - name: Test macOS
        if: runner.os == 'macOS' && matrix.build-tests == 'ON'
        shell: bash
        run: ctest --test-dir build --build-config Release --output-on-failure

      - name: Validate installed consumer on exact Qt 5.14.2
        if: matrix.name == 'windows-qt5.14.2-v142'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          python scripts/ci/run-consumer-matrix.py
          --scenario install-shared
          --build-root "${{ github.workspace }}/build/consumer-qt5142"
          --producer-build-dir "${{ github.workspace }}/build"
          --generator Ninja

      - name: Validate installed consumer on Windows Qt 6
        if: matrix.name == 'windows-qt6.7.3-v142'
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: >
          python scripts/ci/run-consumer-matrix.py
          --scenario install-shared
          --build-root "${{ github.workspace }}/build/consumer-windows-qt6"
          --producer-build-dir "${{ github.workspace }}/build"
          --generator Ninja

      - name: Validate installed consumer on macOS
        if: matrix.name == 'macos-qt6.8.3'
        shell: bash
        run: >
          python3 scripts/ci/run-consumer-matrix.py
          --scenario install-shared
          --build-root "${{ github.workspace }}/build/consumer-macos"
          --producer-build-dir "${{ github.workspace }}/build"
          --generator Ninja

  designer-plugin:
    name: designer-plugin-qt6
    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt/build dependencies
        run: |
          bash scripts/ci/install-ubuntu-deps.sh
          sudo apt-get install -y qt6-tools-dev

      - name: Configure Designer plugin
        run: >
          cmake -S . -B build-designer -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQTMATERIAL3_BUILD_TESTS=ON
          -DQTMATERIAL3_BUILD_EXAMPLES=OFF
          -DQTMATERIAL3_BUILD_BENCHMARKS=OFF
          -DQTMATERIAL3_BUILD_DESIGNER_PLUGIN=ON
          -DQTMATERIAL3_INSTALL=ON
          -DQTMATERIAL3_USE_MCU=OFF

      - name: Build Designer plugin
        # The install contract stages the complete QtMaterial3 package, not
        # only the Designer module. Build the default target so every
        # installable runtime dependency (ThemeIO, ThemeModel, widgets, …)
        # exists before cmake --install.
        run: cmake --build build-designer --parallel

      - name: Test Designer contracts
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build-designer --output-on-failure -R "designer_(collection_contract|ui_smoke)"

      - name: Stage Designer plugin
        run: |
          cmake --install build-designer --prefix "${{ github.workspace }}/build-designer/stage"
          find build-designer/stage -type f -path "*/plugins/designer/*" -print -quit | grep .

  designer-plugin-qt5-windows:
    name: designer-plugin-qt5.14.2-windows
    runs-on: windows-2022
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6

      - name: Install Ninja
        shell: pwsh
        run: choco install ninja --no-progress -y

      - name: Set up MSVC environment
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $installationPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $installationPath) { throw "Visual Studio installation not found" }
          $vsDevCmd = Join-Path $installationPath "Common7\Tools\VsDevCmd.bat"
          $environment = cmd.exe /d /s /c ('"' + $vsDevCmd + '" -no_logo -arch=x64 -host_arch=x64 -vcvars_ver=14.29 && set')
          if ($LASTEXITCODE -ne 0) { throw "VsDevCmd failed" }
          foreach ($line in $environment) {
            if ($line -match '^([^=]+)=(.*)$') {
              $name = $matches[1]
              if (@("PATH","INCLUDE","LIB","LIBPATH","VCINSTALLDIR","VCToolsInstallDir","VCToolsVersion","VSINSTALLDIR","VisualStudioVersion","WindowsSdkDir","WindowsSDKVersion","UniversalCRTSdkDir","UCRTVersion") -contains $name) {
                "$name=$($matches[2])" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
          }

      - name: Install Qt 5.14.2
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.14.2"
          host: windows
          target: desktop
          arch: win64_msvc2017_64
          cache: true

      - name: Configure Designer plugin
        shell: pwsh
        run: >
          cmake -S . -B build-designer-qt5 -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_C_COMPILER=cl
          -DCMAKE_CXX_COMPILER=cl
          "-DQTMATERIAL3_EXPECT_QT_VERSION=5.14.2"
          -DQTMATERIAL3_BUILD_TESTS=ON
          -DQTMATERIAL3_BUILD_EXAMPLES=OFF
          -DQTMATERIAL3_BUILD_BENCHMARKS=OFF
          -DQTMATERIAL3_BUILD_DESIGNER_PLUGIN=ON
          -DQTMATERIAL3_INSTALL=ON
          -DQTMATERIAL3_USE_MCU=OFF

      - name: Build and test Designer plugin
        shell: pwsh
        run: |
          cmake --build build-designer-qt5 --parallel
          if ($LASTEXITCODE -ne 0) { throw "Designer build failed" }
          ctest --test-dir build-designer-qt5 --output-on-failure -R "designer_(collection_contract|ui_smoke)"
          if ($LASTEXITCODE -ne 0) { throw "Designer contracts failed" }
          cmake --install build-designer-qt5 --prefix "${{ github.workspace }}\build-designer-qt5\stage"
          if ($LASTEXITCODE -ne 0) { throw "Designer install failed" }
          $plugin = Get-ChildItem "${{ github.workspace }}\build-designer-qt5\stage" -Recurse -File | Where-Object { $_.FullName -match '[\\/]plugins[\\/]designer[\\/]' } | Select-Object -First 1
          if (-not $plugin) { throw "Designer plugin was not staged" }

  consumer-contract:
    name: consumer-${{ matrix.scenario }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - source-static
          - add-subdirectory-shared
          - fetchcontent-static
          - install-shared
          - install-static
          - invalid-package-component

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v6

      - name: Install Qt/build dependencies
        run: bash scripts/ci/install-ubuntu-deps.sh

      - name: Validate matrix contract
        run: python3 tools/check_build_consumer_matrix.py

      - name: Build consumer scenario
        run: >
          python3 scripts/ci/run-consumer-matrix.py
          --scenario "${{ matrix.scenario }}"
          --build-root "${{ github.workspace }}/build/consumer-contract"

  release-package:
    name: release-package
    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt/build dependencies
        run: bash scripts/ci/install-ubuntu-deps.sh

      - name: Configure release package
        run: >
          cmake -S . -B build-release -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQTMATERIAL3_BUILD_TESTS=OFF
          -DQTMATERIAL3_BUILD_EXAMPLES=OFF
          -DQTMATERIAL3_BUILD_BENCHMARKS=OFF
          -DQTMATERIAL3_USE_MCU=OFF
          -DQTMATERIAL3_INSTALL=ON

      - name: Build and stage install
        run: |
          cmake --build build-release --parallel
          cmake --install build-release --prefix "${{ github.workspace }}/build-release/stage"

      - name: Build binary archives
        working-directory: build-release
        run: |
          cpack -G TGZ
          cpack -G ZIP

      - name: Build source archives
        working-directory: build-release
        run: |
          cpack --config CPackSourceConfig.cmake -G TGZ
          cpack --config CPackSourceConfig.cmake -G ZIP

      - name: Verify archive set
        shell: bash
        run: |
          set -euo pipefail
          test "$(find build-release -maxdepth 1 -name 'qt-material3-widget-*.tar.gz' | wc -l)" -ge 1
          test "$(find build-release -maxdepth 1 -name 'qt-material3-widget-*.zip' | wc -l)" -ge 1
          test -f build-release/stage/share/doc/qt-material3-widget/LICENSE
          test -f build-release/stage/share/doc/qt-material3-widget/CHANGELOG.md

      - name: Upload release archives
        uses: actions/upload-artifact@v6
        with:
          name: qt-material3-widget-packages
          path: |
            build-release/qt-material3-widget-*.tar.gz
            build-release/qt-material3-widget-*.zip
          if-no-files-found: error

  examples-benchmarks:
    name: examples-benchmarks
    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt/build dependencies
        run: bash scripts/ci/install-ubuntu-deps.sh

      - name: Configure examples and benchmarks
        run: >
          cmake -S . -B build-extras -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQTMATERIAL3_BUILD_TESTS=OFF
          -DQTMATERIAL3_BUILD_EXAMPLES=ON
          -DQTMATERIAL3_BUILD_BENCHMARKS=ON
          -DQTMATERIAL3_BUILD_CONSUMER_EXAMPLES=OFF
          -DQTMATERIAL3_BUILD_THEMING_EXAMPLES=ON
          -DQTMATERIAL3_USE_MCU=OFF

      - name: Build examples and benchmarks
        run: cmake --build build-extras --parallel

  sanitizers:
    name: sanitizers-linux
    runs-on: ubuntu-latest
    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
    steps:
      - uses: actions/checkout@v6

      - name: Install Qt/build dependencies
        run: bash scripts/ci/install-ubuntu-deps.sh

      - name: Configure ASan and UBSan
        run: >
          cmake -S . -B build-sanitize -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
          -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined"
          -DQTMATERIAL3_BUILD_TESTS=ON
          -DQTMATERIAL3_BUILD_EXAMPLES=OFF
          -DQTMATERIAL3_BUILD_BENCHMARKS=OFF
          -DQTMATERIAL3_BUILD_VISUAL_REGRESSION_TESTS=OFF
          -DQTMATERIAL3_USE_MCU=OFF

      - name: Build sanitizer configuration
        run: cmake --build build-sanitize --parallel

      - name: Run sanitizer tests
        shell: bash
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            python3 scripts/ci/run-with-openbox.py -- ctest --test-dir build-sanitize --output-on-failure

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Python checker tests
        run: >
          python3 -m unittest discover
          -s tests/tools
          -p "test_architecture_checker.py"
          -v

      - name: Architecture checker
        run: python3 scripts/architecture/check_architecture.py --root .
