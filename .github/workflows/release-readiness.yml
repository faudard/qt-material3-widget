name: release-readiness

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  schedule:
    # Nightly, 03:00 UTC every Monday.
    - cron: "0 3 * * 1"

concurrency:
  group: release-readiness-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-contract:
    name: release-contract
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate release contract
        run: python3 tools/check_release.py --root . --scope all

  stable-visual-baseline:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v1.')
    needs: release-contract
    name: stable-visual-baseline
    runs-on: ubuntu-24.04

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CTEST_OUTPUT_ON_FAILURE: 1
      QTMATERIAL3_VISUAL_STRICT: 1
      QT_STYLE_OVERRIDE: Fusion

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Linux runtime packages
        run: bash scripts/ci/install-ubuntu-deps.sh

      - name: Install pinned Qt 6.4.0
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.4.0"
          host: linux
          target: desktop
          arch: gcc_64
          cache: true

      - name: Configure visual baseline validation
        run: >
          cmake -S . -B build-visual -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQTMATERIAL3_BUILD_TESTS=ON
          -DQTMATERIAL3_BUILD_EXAMPLES=OFF
          -DQTMATERIAL3_BUILD_BENCHMARKS=OFF
          -DQTMATERIAL3_BUILD_VISUAL_REGRESSION_TESTS=ON
          -DQTMATERIAL3_USE_MCU=OFF

      - name: Build visual regression target
        run: cmake --build build-visual --target tst_theme_visual_regression --parallel

      - name: Compare reviewed visual goldens
        run: |
          xvfb-run -a --server-args="-screen 0 1920x1080x24" \
            bash -c 'openbox >/tmp/openbox-visual.log 2>&1 & ctest --test-dir build-visual --output-on-failure -R tst_theme_visual_regression'

  linux:
    needs: release-contract
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-qt6-release
            qt_major: 6
            cmake_extra_args: >-
              -DQTMATERIAL3_USE_MCU=OFF

          - name: ubuntu-qt5-compat
            qt_major: 5
            cmake_extra_args: >-
              -DQTMATERIAL3_USE_MCU=OFF

    env:
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CTEST_OUTPUT_ON_FAILURE: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install common dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake \
            ninja-build \
            g++ \
            xvfb

      - name: Install Qt 6 dependencies
        if: matrix.qt_major == 6
        run: |
          sudo apt-get install -y \
            qt6-base-dev \
            qt6-base-dev-tools

      - name: Install Qt 5 dependencies
        if: matrix.qt_major == 5
        run: |
          sudo apt-get install -y \
            qtbase5-dev \
            qtbase5-dev-tools

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DQTMATERIAL3_BUILD_TESTS=ON \
            -DQTMATERIAL3_BUILD_EXAMPLES=ON \
            -DQTMATERIAL3_BUILD_CONSUMER_EXAMPLES=ON \
            -DQTMATERIAL3_BUILD_THEMING_EXAMPLES=ON \
            -DQTMATERIAL3_BUILD_BENCHMARKS=OFF \
            ${{ matrix.cmake_extra_args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: |
          xvfb-run -a ctest \
            --test-dir build \
            --build-config Release \
            --output-on-failure

      - name: Install package
        run: |
          cmake --install build --config Release --prefix "$PWD/install"

      - name: Validate installed package consumer
        run: >
          python3 scripts/ci/run-consumer-matrix.py
          --scenario install-shared
          --build-root "$PWD/build/release-consumer"
          --generator Ninja

      - name: Upload install tree
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: install-tree-${{ matrix.name }}
          path: install
          if-no-files-found: ignore

      - name: Upload CTest logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: ctest-logs-${{ matrix.name }}
          path: |
            build/Testing/Temporary/LastTest.log
            build/Testing/Temporary/LastTestsFailed.log
          if-no-files-found: ignore