name: Visual Studio 1.26 (opt-in tool)
on:
  pull_request:
    paths:
      - 'studio/**'
      - 'CMakeLists.txt'
      - '.github/workflows/visual-studio.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  studio-qt6:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Qt and graphics test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build qt6-base-dev qt6-base-dev-tools libgl1-mesa-dev
      - name: Configure
        run: >
          cmake -S . -B build/studio-ci -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DQTMATERIAL3_BUILD_VISUAL_STUDIO=ON
          -DQTMATERIAL3_BUILD_TESTS=ON
          -DQTMATERIAL3_BUILD_EXAMPLES=OFF
          -DQTMATERIAL3_ENABLE_ARCHITECTURE_CHECKS=OFF
      - name: Compile the tool and its contracts
        # Install the complete SDK, not only the Studio executable and one
        # test target: cmake --install also needs ThemeIO and sibling libs.
        run: cmake --build build/studio-ci --parallel 2
      - name: Contract tests
        run: ctest --test-dir build/studio-ci -R '^studio_document_contract$' --output-on-failure
      - name: Load and export fixture
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          mkdir -p build/studio-ci/generated
          build/studio-ci/studio/qtmaterial3_visual_studio --check studio/fixtures/form.json
          build/studio-ci/studio/qtmaterial3_visual_studio --export-ui studio/fixtures/form.json build/studio-ci/generated/form.ui
          build/studio-ci/studio/qtmaterial3_visual_studio --export-cpp studio/fixtures/form.json build/studio-ci/generated/cpp
          grep -F 'QtMaterial::QtMaterialFilledButton' build/studio-ci/generated/form.ui
          grep -F 'QtMaterial3::Widgets' build/studio-ci/generated/cpp/CMakeLists.txt
          /usr/lib/qt6/libexec/uic build/studio-ci/generated/form.ui -o build/studio-ci/generated/ui_form.h
      - name: Install SDK and compile/run generated C++ application
        env:
          QT_QPA_PLATFORM: offscreen
          QTMATERIAL3_STUDIO_SMOKE: "1"
        run: |
          cmake --install build/studio-ci --prefix "${PWD}/build/studio-ci/stage"
          cmake -S build/studio-ci/generated/cpp -B build/studio-ci/generated-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${PWD}/build/studio-ci/stage"
          cmake --build build/studio-ci/generated-build --parallel 2
          build/studio-ci/generated-build/studio_generated
